<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Frame host fixture</title>
    <style>
      body { margin: 0; min-height: 4000px; }
      iframe { display: block; width: 640px; height: 320px; border: 0; }
    </style>
  </head>
  <body>
    <button id="top-focus" type="button">Focus the top document</button>
    <iframe id="content-frame" title="Embedded content"></iframe>
    <script>
      const mode = new URLSearchParams(location.search).get('mode') ?? 'tall';
      const frame = document.querySelector('#content-frame');

      if (mode === 'srcdoc') {
        frame.srcdoc = `<!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><style>body { margin: 0; min-height: 2400px; }</style></head>
            <body><button id="focus-target" type="button">Focus script-created frame</button></body>
          </html>`;
      } else if (mode === 'cross-origin') {
        frame.src = `http://localhost:${location.port}/frame-content.html?mode=tall`;
      } else {
        frame.src = `/frame-content.html?mode=${encodeURIComponent(mode)}`;
      }
    </script>
  </body>
</html>
