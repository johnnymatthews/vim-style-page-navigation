<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font: 13px system-ui, sans-serif;
      margin: 0;
      padding: 14px 16px;
      min-width: 230px;
      background: #1e1e1e;
      color: #eee;
    }
    #host { font-weight: bold; font-family: monospace; margin-bottom: 10px; }
    #toggle {
      width: 100%;
      padding: 6px 0;
      border: 1px solid #555;
      border-radius: 6px;
      background: #2a2a2a;
      color: #eee;
      cursor: pointer;
    }
    #toggle:hover { background: #383838; }
    #note { color: #888; font-size: 11px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="host"></div>
  <button id="toggle"></button>
  <div id="note">Applies instantly to open tabs — no reload needed.</div>
  <script src="popup.js"></script>
</body>
</html>
