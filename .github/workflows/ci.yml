name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Build, Vitest, then Playwright against the built Chrome package.
      - run: npm test

      # Runs after the build, which generates .wxt/tsconfig.json.
      - run: npx tsc --noEmit

      - run: npm run zip

      - run: npm run zip:firefox

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
